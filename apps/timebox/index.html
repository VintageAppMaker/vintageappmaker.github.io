<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#292929">
  <meta name="application-name" content="Timebox OS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timebox OS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/timebox-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/timebox-icon-192.png">
  <title>Timebox OS — 로컬 단일 HTML</title>
  <style>
    :root{--ink:#292929;--muted:#6f6f6b;--paper:#d7d7d3;--sheet:#f4f2ea;--line:#c5c5bf}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif KR","Nanum Myeongjo",serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
    #app{min-height:100vh;padding-bottom:70px;background-image:radial-gradient(#29292914 .8px,transparent .8px);background-size:5px 5px}
    .topbar{height:64px;background:var(--sheet);display:flex;align-items:center;padding:0 4vw;gap:20px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--ink);box-shadow:0 2px 10px #332f2720}
    .icon{background:transparent;border:1px solid var(--ink);width:38px;height:38px;font-size:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.brandMark{background:var(--ink);color:var(--sheet);padding:8px 7px}.saveState{margin-left:auto;color:var(--muted);font-size:12px}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:8px}
    .hero{max-width:1420px;margin:28px auto 0;padding:42px 4vw 30px;display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:end;background:var(--sheet);border:1px solid var(--line);border-top:5px solid var(--ink);box-shadow:4px 7px 16px #433d3118}
    .eyebrow{margin:0 0 12px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.18em}.heroTitle{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:clamp(34px,5vw,66px);font-weight:700;letter-spacing:-.045em;line-height:1.08;outline:none}.dateCard{padding:18px;border:1px solid var(--ink);display:grid}.dateCard span,.dateCard small{font-size:10px;letter-spacing:.12em;color:var(--muted)}.dateCard input{background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 0;margin-bottom:12px}.dateCard strong{font-size:30px}
    .workspace{max-width:1420px;margin:24px auto;display:grid;grid-template-columns:26px 380px 1fr;gap:24px;padding:0 4vw}.binder{background:#333;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:9px 0;box-shadow:2px 4px 8px #0003}.binder i{display:block;width:38px;height:8px;border:2px solid #262626;border-radius:8px;background:linear-gradient(#d2d2cf,#858582,#d8d8d4);transform:translateX(-8px)}
    .panel,.timeline{background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0,transparent 31px,#d0d0cb 32px);border:1px solid var(--line);box-shadow:3px 6px 14px #433d3114}.panel{margin-bottom:18px}.panelHead{display:flex;align-items:center;border-bottom:1px solid var(--ink);background:var(--sheet)}.panelHead span{background:var(--ink);color:var(--sheet);padding:10px 12px;font-size:11px;font-weight:900}.panelHead h2{font-size:12px;letter-spacing:.09em;margin:0;padding:0 12px}
    .priority{display:grid;grid-template-columns:38px 1fr;align-items:start;padding:10px 12px;border-bottom:1px dashed var(--line)}.priority textarea,.task,.category{display:block;border:0;background:transparent;outline:none;font-weight:700;width:100%;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;min-height:30px;line-height:1.65}.check{width:27px;height:27px;border:1px solid var(--ink);background:var(--sheet);font-size:11px;font-weight:900}.check.checked{background:var(--ink);color:var(--sheet)}.notes,.reflection{width:100%;border:0;resize:vertical;min-height:170px;padding:16px;background:transparent;line-height:2;outline:none}.reflection{min-height:90px}
    .timeline{padding:22px}.timelineHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;background:var(--sheet)}.timelineHead h2{font-size:26px;margin:0}.primary{background:var(--ink);border:1px solid var(--ink);color:var(--sheet);padding:13px 16px;font-size:11px;font-weight:900;box-shadow:3px 3px 0 #bdb5a7}
    .timeBlock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;background:#f6f4ed;border:1px solid var(--line);border-left:4px solid var(--ink);padding:8px 12px;margin-bottom:12px}.timeBlock.done{opacity:.48}.timeBlock.done .task{text-decoration:line-through}.fieldRow{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:start;border-bottom:1px dashed var(--line);min-height:44px;padding:7px 0}.fieldRow:last-child{border-bottom:0}.fieldRow>label{padding:6px 10px 0 2px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em}.task,.category{padding:2px 6px}.category{font-size:13px;font-weight:800}.timeInputs{display:grid;grid-template-columns:minmax(92px,130px) 18px minmax(92px,130px);gap:5px;align-items:center}.timeInputs i{height:1px;background:var(--ink)}.timeInputs input{width:100%;min-width:0;border:0;background:transparent;padding:5px 6px;font-size:12px;font-weight:900}.actions{display:flex;gap:5px;padding-top:7px}.actions button{border:1px solid var(--line);background:var(--sheet);width:30px;height:30px}
    .scrim{position:fixed;inset:0;background:#28251f99;z-index:50;display:flex;justify-content:flex-end}.scrim[hidden]{display:none}.menu{width:min(420px,92vw);height:100%;background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0,transparent 31px,#d0d0cb 32px);padding:28px;display:flex;flex-direction:column;gap:10px;box-shadow:-20px 0 60px #0003}.menuTitle{display:flex;justify-content:space-between;align-items:start;border-bottom:3px double var(--ink);padding-bottom:18px;margin-bottom:14px}.menuTitle span{font-size:10px;letter-spacing:.16em;color:var(--muted)}.menuTitle h2{margin:5px 0 0}.menuTitle button{border:0;background:transparent;font-size:32px}.menu>button{padding:14px;text-align:left;border:1px solid var(--line);background:#f6f4ed;font-weight:800}.menu .danger{margin-top:auto;color:#682f29}.notice{position:fixed;left:50%;bottom:22px;z-index:80;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:13px 20px;font-size:13px;font-weight:700;box-shadow:0 7px 24px #0004}.notice[hidden]{display:none}.notice.error{background:#682f29}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.workspace{grid-template-columns:18px 1fr}.binder{grid-row:1/3}.workspace>aside,.timeline{grid-column:2}}
    @media(max-width:580px){.topbar{padding:0 14px}.brand span:last-child,.saveState{display:none}.hero{padding:30px 18px 24px}.workspace{grid-template-columns:12px 1fr;gap:10px;padding:0 12px}.binder i{width:24px;height:7px}.timeline{padding:14px}.timelineHead h2{font-size:21px}.primary{padding:11px;font-size:9px}.timeBlock{grid-template-columns:1fr;gap:4px;padding:7px 9px}.fieldRow{grid-template-columns:52px minmax(0,1fr)}.timeInputs{grid-template-columns:minmax(82px,1fr) 12px minmax(82px,1fr)}.actions{justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}}
  </style>
</head>
<body>
<div id="app">
  <header class="topbar"><button class="icon" id="openMenu" aria-label="메뉴">☰</button><div class="brand"><span class="brandMark">T/B</span><span>TIMEBOX OS</span></div><div class="saveState"><span class="pulse"></span>자동 저장 <b id="savedAt"></b></div></header>
  <section class="hero"><div><p class="eyebrow">DAILY TIMEBOX NOTE · LOCAL SINGLE HTML</p><input id="title" class="heroTitle" aria-label="오늘의 선언"></div><div class="dateCard"><span>오늘의 날짜</span><input id="date" type="date"><strong id="progress">0/0</strong><small>완료한 시간 블록</small></div></section>
  <div class="workspace"><div class="binder" aria-hidden="true"></div><aside><section class="panel"><div class="panelHead"><span>01</span><h2>오늘의 우선순위 3</h2></div><div id="priorities"></div></section><section class="panel"><div class="panelHead"><span>02</span><h2>빠른 메모</h2></div><textarea id="notes" class="notes"></textarea></section><section class="panel"><div class="panelHead"><span>03</span><h2>하루 회고</h2></div><textarea id="reflection" class="reflection"></textarea></section></aside>
  <section class="timeline"><div class="timelineHead"><div><p class="eyebrow">TIME TABLE</p><h2>오늘의 타임박스</h2></div><button id="addBlock" class="primary">＋ Task 추가</button></div><div id="blocks"></div></section></div>
</div>
<div id="scrim" class="scrim" hidden><section class="menu"><div class="menuTitle"><div><span>CONTROL PANEL</span><h2>계획 데이터</h2></div><button id="closeMenu">×</button></div><button id="saveJson">JSON 파일 저장</button><button id="loadJson">JSON 불러오기</button><button id="copyJson">JSON 복사</button><button id="savePreview">HTML 프리뷰 파일 저장</button><button id="reset" class="danger">초기화</button><input id="fileInput" hidden type="file" accept=".json,application/json"></section></div>
<div id="notice" class="notice" hidden role="status"></div>
<script>
(()=>{
  "use strict";
  const KEY="timebox-planner-v1", uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10);
  const initial=()=>({title:"할 일만 집중",date:today(),priorities:[["가장 중요한 결과를 정의하기",false],["집중 작업을 오전에 끝내기",false],["다음 행동을 기록하기",false]].map(x=>({id:uid(),text:x[0],done:x[1]})),blocks:[["08:00","08:30","오늘의 목표와 우선순위 설계","#계획"],["08:30","10:00","핵심 프로젝트 — 방해 없는 딥워크","#집중"],["10:00","10:15","휴식 · 산책 · 리셋","#휴식"],["10:15","11:00","메일과 짧은 의사결정","#관리"]].map(x=>({id:uid(),start:x[0],end:x[1],task:x[2],category:x[3],done:false})),notes:"아이디어, 약속, 나중에 처리할 일을 여기에 적으세요.",reflection:"오늘을 성공으로 만드는 한 문장은?",accent:"#292929"});
  const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])), multi=s=>esc(s).replace(/\n/g,"<br>");
  const hashtag=s=>String(s||"").split(/\s+/).filter(Boolean).map(t=>t.startsWith("#")?t:"#"+t).join(" ");
  let data=load();
  function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p){const d={...initial(),...p};d.title=d.title==="Build the future, one block at a time."?"할 일만 집중":d.title;d.blocks=(d.blocks||[]).map(b=>({...b,id:b.id||uid(),category:hashtag(b.category)}));d.priorities=(d.priorities||[]).map(p=>({...p,id:p.id||uid()}));return d}}catch(e){}return initial()}
  function persist(){localStorage.setItem(KEY,JSON.stringify(data));$("#savedAt").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});$("#progress").textContent=data.blocks.filter(b=>b.done).length+"/"+data.blocks.length}
  function grow(el){el.style.height="0";el.style.height=el.scrollHeight+"px"}
  function renderStatic(){$("#title").value=data.title;$("#date").value=data.date;$("#notes").value=data.notes;$("#reflection").value=data.reflection}
  function renderPriorities(){$("#priorities").innerHTML=data.priorities.map((p,i)=>`<div class="priority" data-id="${p.id}"><button class="check ${p.done?"checked":""}">${p.done?"✓":i+1}</button><textarea rows="1" aria-label="우선순위 ${i+1}">${esc(p.text)}</textarea></div>`).join("");document.querySelectorAll(".priority textarea").forEach(grow)}
  function renderBlocks(){$("#blocks").innerHTML=data.blocks.map(b=>`<article class="timeBlock ${b.done?"done":""}" data-id="${b.id}"><div><div class="fieldRow"><label>시간</label><div class="timeInputs"><input class="start" type="time" value="${esc(b.start)}"><i></i><input class="end" type="time" value="${esc(b.end)}"></div></div><div class="fieldRow"><label>할 일</label><textarea rows="1" class="task">${esc(b.task)}</textarea></div><div class="fieldRow"><label>분류</label><textarea rows="1" class="category">${esc(b.category)}</textarea></div></div><div class="actions"><button class="doneBtn">${b.done?"↺":"✓"}</button><button class="deleteBtn">×</button></div></article>`).join("");document.querySelectorAll(".task,.category").forEach(grow);persist()}
  function patch(id,key,value){const b=data.blocks.find(x=>x.id===id);if(b){b[key]=value;persist()}}
  function addHour(t){const [h,m]=t.split(":").map(Number);return String((h+1)%24).padStart(2,"0")+":"+String(m).padStart(2,"0")}
  function notice(msg,error=false){const n=$("#notice");n.textContent=msg;n.className="notice"+(error?" error":"");n.hidden=false;clearTimeout(notice.t);notice.t=setTimeout(()=>n.hidden=true,2400)}
  function download(name,content,type){const blob=new Blob(["\uFEFF",content],{type:type+";charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);notice(name+" 저장을 시작했습니다.")}
  function preview(){return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(data.title)}</title><style>body{font:16px Georgia,serif;max-width:820px;margin:40px auto;padding:28px;color:#292722;background:#e8e3d8}main{background:#f8f4e9;padding:48px;box-shadow:0 2px 16px #0002;background-image:repeating-linear-gradient(transparent 0,transparent 31px,#c9c3b5 32px)}h1{font-size:34px;border-bottom:2px solid;padding-bottom:14px}.block{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid #aaa}.done{text-decoration:line-through;color:#888}h2{margin-top:32px;font-size:18px}@media(max-width:600px){body{margin:0;padding:10px}main{padding:24px}.block{grid-template-columns:1fr;gap:4px}}</style></head><body><main><h1>${esc(data.title)}</h1><p>${esc(data.date)}</p><h2>오늘의 우선순위 3</h2><ol>${data.priorities.map(p=>`<li class="${p.done?"done":""}">${multi(p.text)}</li>`).join("")}</ol><h2>타임박스</h2>${data.blocks.map(b=>`<div class="block ${b.done?"done":""}"><b>${esc(b.start)}—${esc(b.end)}</b><span>${multi(b.task)} · ${multi(b.category)}</span></div>`).join("")}<h2>메모</h2><p>${multi(data.notes)}</p><h2>하루 회고</h2><p>${multi(data.reflection)}</p></main></body></html>`}
  ["title","date","notes","reflection"].forEach(id=>$("#"+id).addEventListener("input",e=>{data[id]=e.target.value;persist()}));
  $("#priorities").addEventListener("input",e=>{if(e.target.tagName!=="TEXTAREA")return;const p=data.priorities.find(x=>x.id===e.target.closest("[data-id]").dataset.id);p.text=e.target.value;grow(e.target);persist()});
  $("#priorities").addEventListener("click",e=>{if(!e.target.classList.contains("check"))return;const p=data.priorities.find(x=>x.id===e.target.closest("[data-id]").dataset.id);p.done=!p.done;renderPriorities();persist()});
  $("#blocks").addEventListener("input",e=>{const a=e.target.closest("[data-id]");if(!a)return;const key=e.target.classList.contains("start")?"start":e.target.classList.contains("end")?"end":e.target.classList.contains("task")?"task":"category";patch(a.dataset.id,key,e.target.value);if(e.target.tagName==="TEXTAREA")grow(e.target)});
  $("#blocks").addEventListener("click",e=>{const a=e.target.closest("[data-id]");if(!a)return;const b=data.blocks.find(x=>x.id===a.dataset.id);if(e.target.classList.contains("doneBtn"))b.done=!b.done;else if(e.target.classList.contains("deleteBtn"))data.blocks=data.blocks.filter(x=>x.id!==b.id);else return;renderBlocks()});
  $("#addBlock").onclick=()=>{const start=data.blocks.at(-1)?.end||"09:00";data.blocks.push({id:uid(),start,end:addHour(start),task:"새 Task",category:"#집중",done:false});renderBlocks()};
  $("#openMenu").onclick=()=>$("#scrim").hidden=false;$("#closeMenu").onclick=()=>$("#scrim").hidden=true;$("#scrim").onclick=e=>{if(e.target.id==="scrim")e.currentTarget.hidden=true};
  $("#saveJson").onclick=()=>download(`timebox-${data.date}.json`,JSON.stringify(data,null,2),"application/json");$("#savePreview").onclick=()=>download("timebox-preview.html",preview(),"text/html");
  $("#loadJson").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data={...initial(),...JSON.parse(r.result)};data.blocks=(data.blocks||[]).map(b=>({...b,id:b.id||uid(),category:hashtag(b.category)}));renderStatic();renderPriorities();renderBlocks();$("#scrim").hidden=true;notice("JSON 계획을 불러왔습니다.")}catch(x){notice("올바른 JSON 파일이 아닙니다.",true)}};r.readAsText(f)};
  $("#copyJson").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(data,null,2));notice("JSON을 복사했습니다.")}catch(e){notice("브라우저가 클립보드 접근을 허용하지 않았습니다.",true)}};
  $("#reset").onclick=()=>{if(confirm("오늘의 계획을 초기화할까요?")){data=initial();renderStatic();renderPriorities();renderBlocks();$("#scrim").hidden=true}};
  document.querySelector(".binder").innerHTML="<i></i>".repeat(16);renderStatic();renderPriorities();renderBlocks();persist();
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
