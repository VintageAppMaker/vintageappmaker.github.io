<!doctype html>
<html lang="ko">
<head>

<style>
:root{--paper:#cdbd98;--ink:#292923;--muted:#746c59;--red:#9b493c;--blue:#49677a;--sheet:#ded1af;--shadow:rgba(43,37,25,.26)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);font-family:"Poor Story","Nanum Pen Script","Segoe Print","Bradley Hand",cursive}
body{background:var(--paper);background-image:radial-gradient(rgba(66,55,34,.11) .7px,transparent .8px),radial-gradient(rgba(255,255,255,.15) .6px,transparent .8px);background-size:5px 5px,7px 7px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(4deg,transparent 0 17px,rgba(62,50,30,.045) 18px,transparent 19px)}
.app{height:100%;display:flex;flex-direction:column}.top{height:70px;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:5;border-bottom:2px solid rgba(67,57,37,.27);box-shadow:0 2px 0 rgba(255,255,255,.18)}
.brand{margin-right:auto;line-height:.9}.brand b{display:block;font-size:25px;letter-spacing:1px;transform:rotate(-1deg)}.brand small{font:600 11px system-ui;color:var(--muted);letter-spacing:.13em}
button,.fileLabel{border:0;background:transparent;color:var(--ink);font:700 20px inherit;cursor:pointer;padding:8px 10px;position:relative}.tool{display:inline-grid;place-items:center;width:42px;height:42px;padding:0;border:1.5px solid rgba(45,41,30,.28);border-radius:50%;background:rgba(255,255,255,.12)}.tool svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.tool:hover{color:var(--red);background:rgba(255,255,255,.2);border-color:rgba(155,73,60,.42)}
.board{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}.board.dragging{cursor:grabbing}.world{position:absolute;inset:0;transform-origin:0 0}.edges{position:absolute;inset:0;overflow:visible;width:1px;height:1px;pointer-events:none}.edge{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;opacity:.68}.edge.ghost{stroke-dasharray:4 7;opacity:.38}
.node{position:absolute;min-width:90px;max-width:420px;min-height:44px;padding:13px 16px 11px;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-size:21px;font-weight:700;line-height:1.05;cursor:move;user-select:none;filter:drop-shadow(1px 3px 2px rgba(45,36,20,.14));transform:translate(-50%,-50%) rotate(var(--tilt));touch-action:none}.node:before{content:"";position:absolute;inset:1px -3px -1px 0;border:2px solid var(--tone,var(--ink));border-radius:48% 52% 45% 55% / 52% 45% 55% 48%;transform:rotate(-.7deg);background:rgba(222,210,174,.38);z-index:-1}.node.shape-rect:before{border-radius:3px 6px 4px 2px;transform:rotate(-.35deg)}.node.shape-none:before{border-color:transparent;background:transparent}.node.root{font-size:27px;min-width:155px}.node.root:before{border-width:3px;background:rgba(231,218,179,.66)}.node.root.shape-none:before{border-color:transparent;background:transparent}.node.selected:before{box-shadow:0 0 0 5px rgba(155,73,60,.14);border-color:var(--red)}.node.drop-target:before{box-shadow:0 0 0 7px rgba(73,103,122,.16);border-color:var(--blue)}.node.shape-none.selected{outline:2px dashed rgba(155,73,60,.55);outline-offset:4px}.node.shape-none.drop-target{outline:2px dashed rgba(73,103,122,.7);outline-offset:7px}.node.shape-none.selected:before,.node.shape-none.drop-target:before{border-color:transparent;background:transparent;box-shadow:none}.resize-handle{display:none;position:absolute;right:-10px;bottom:-11px;width:20px;height:20px;border:2px solid var(--tone,var(--ink));background:var(--sheet);border-radius:50%;cursor:nwse-resize;z-index:2}.resize-handle:after{content:"↘";position:absolute;inset:-4px 0 0 1px;font:700 15px system-ui}.node.selected .resize-handle{display:block}.hint{position:absolute;left:16px;bottom:18px;font:600 12px system-ui;color:rgba(50,45,34,.55);pointer-events:none}.fab{position:absolute;right:20px;bottom:22px;width:58px;height:58px;border:2px solid var(--ink);border-radius:50% 47% 51% 45%;background:var(--sheet);font:32px/1 system-ui;box-shadow:3px 5px 0 var(--shadow);z-index:4}.fab:active{transform:translate(2px,3px);box-shadow:1px 2px 0 var(--shadow)}
.backdrop{position:fixed;inset:0;background:rgba(30,26,19,.26);opacity:0;visibility:hidden;transition:.22s;z-index:10}.backdrop.open{opacity:1;visibility:visible}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--sheet);background-image:radial-gradient(rgba(52,42,25,.09) .65px,transparent .7px);background-size:5px 5px;border-radius:24px 24px 0 0;border-top:2px solid rgba(55,46,30,.58);padding:10px max(20px,calc((100vw - 680px)/2)) calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 28px rgba(48,40,25,.2);transform:translateY(110%);transition:transform .28s cubic-bezier(.22,.85,.33,1)}.sheet.open{transform:none}.confirm-sheet p{margin:0;color:var(--muted);font-size:18px;line-height:1.4}.confirm-sheet .actions .delete{background:var(--red);color:#fff;border-color:var(--red);flex:1}.grab{width:54px;height:5px;background:var(--ink);opacity:.25;border-radius:9px;margin:0 auto 13px}.sheet h2{margin:0 0 13px;font-size:27px}.label{font:700 12px system-ui;color:var(--muted);display:block;margin:12px 0 5px}.sheet input,.sheet select,.sheet textarea{display:block;width:100%;max-width:100%;border:0;border-bottom:2px solid rgba(45,41,30,.62);background:rgba(255,255,255,.16);padding:10px 8px 7px;font:700 23px/1.25 inherit;color:var(--ink);outline:none}.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--red);background:rgba(255,255,255,.22)}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.node-tools{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:14px}.node-tools button{min-height:43px;border:1.5px solid rgba(45,41,30,.5);border-radius:5px;background:rgba(255,255,255,.14);font:700 17px inherit}.node-tools button:disabled{opacity:.42;cursor:not-allowed}.yaml-sheet{max-height:76vh}.yaml-box{width:100%;height:min(48vh,420px);resize:none;border:1px solid rgba(45,41,30,.34);border-left:3px solid var(--ink);background:rgba(255,255,255,.16);padding:14px;font:600 15px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink);outline:none;white-space:pre;overflow:auto}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:2px solid var(--ink);border-radius:51% 46% 49% 44% / 14% 17% 15% 13%;background:transparent;font-size:20px}.actions .save{background:var(--ink);color:var(--sheet)}.actions .delete{color:var(--red);border-color:var(--red);flex:.65}.status{position:fixed;left:50%;top:83px;transform:translate(-50%,-12px);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:20px;font:600 13px system-ui;opacity:0;pointer-events:none;transition:.2s;z-index:20}.status.show{opacity:1;transform:translate(-50%,0)}
.node{line-height:1.18}.md-node{display:block;width:100%;text-align:left}.md-line{position:relative;display:flex;align-items:flex-start;gap:6px;margin-left:calc(var(--depth)*13px);min-height:1.18em;overflow-wrap:anywhere}.md-line[data-depth]:not([data-depth="0"]){border-left:1.5px solid color-mix(in srgb,var(--tone) 48%,transparent);padding-left:9px}.md-line[data-depth]:not([data-depth="0"]):before{content:"";position:absolute;left:-1px;top:.58em;width:7px;border-top:1.5px solid color-mix(in srgb,var(--tone) 48%,transparent)}.md-bullet{flex:0 0 5px;width:5px;height:5px;margin-top:.43em;border:1.5px solid var(--tone);border-radius:50%}.md-check{flex:0 0 12px;width:12px;height:12px;margin-top:.18em;border:1.5px solid var(--tone);display:grid;place-items:center;font:9px/1 system-ui}.md-check.done:after{content:"✓"}.md-node h1,.md-node h2,.md-node h3{margin:.12em 0 .2em;line-height:1.05}.md-node h1{font-size:1.22em;border-bottom:1.5px solid currentColor}.md-node h2{font-size:1.12em}.md-node h3{font-size:1.04em}.md-node p{margin:.08em 0}.md-node blockquote{margin:.18em 0;padding-left:8px;border-left:3px solid var(--tone);font-style:italic}.md-node code{font:600 .78em ui-monospace,Consolas,monospace;background:rgba(50,44,30,.1);padding:1px 3px;border-radius:2px}.md-node a{color:var(--blue);text-decoration:underline}.node-text{min-height:112px;max-height:220px;resize:vertical}.node-text:focus{border-color:var(--red)}
.md-line[data-depth]:not([data-depth="0"]){border-left:1.5px solid rgba(50,45,34,.35);padding-left:9px}.md-line[data-depth]:not([data-depth="0"]):before{content:"";position:absolute;left:-1px;top:.58em;width:7px;border-top:1.5px solid rgba(50,45,34,.35)}.md-check.done:after{content:"";width:4px;height:7px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg) translate(-1px,-1px)}
.node-text-content,.node-text-content *{text-align:left}.node-text-content{display:block;flex:1 1 auto;align-self:stretch;min-width:0;min-height:0;width:100%;max-width:100%;max-height:100%;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere}.node-text-content img,.node-text-content video,.node-text-content canvas,.node-text-content svg,.node-text-content iframe,.node-text-content object,.node-text-content embed{display:block;max-width:100%;max-height:100%;object-fit:contain}.node-text-content table{display:block;max-width:100%;overflow:hidden;border-collapse:collapse}.node-text-content pre{max-width:100%;max-height:100%;overflow:hidden;white-space:pre-wrap}.emoji-picker{display:flex;gap:5px;overflow-x:auto;padding:5px 1px 8px}.emoji-picker button{flex:0 0 39px;width:39px;height:39px;padding:0;border:1.5px solid rgba(45,41,30,.35);border-radius:9px;background:rgba(255,255,255,.16);font:22px/1 system-ui}.emoji-picker button:active{transform:scale(.9)}.font-row{display:grid;grid-template-columns:1fr 54px;gap:12px;align-items:center}.font-row input{padding:0;border:0;background:transparent;accent-color:var(--red)}.font-value{font:700 16px system-ui;text-align:center}.font-value output{font-size:19px}
@media(max-width:620px){.top{height:62px;padding:8px 9px}.brand b{font-size:21px}.brand small{display:none}.tool{width:38px;height:38px}.tool svg{width:20px;height:20px}.node{min-width:105px}.hint{font-size:10px}.sheet{padding-left:18px;padding-right:18px}}
.readonly-toggle{width:auto;min-width:68px;padding:0 8px;border-radius:12px;font:600 12px system-ui}.readonly-toggle[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
body.readonly .node{cursor:grab}body.readonly .board.dragging .node{cursor:grabbing}body.readonly .node-text-content{pointer-events:none}body.readonly .resize-handle,body.readonly .fab{display:none!important}.top button:disabled,.fileLabel:has(input:disabled){opacity:.4;cursor:not-allowed}
@media(max-width:620px){.top{gap:5px;overflow-x:auto;flex-shrink:0}.top>*{flex-shrink:0}.brand b{font-size:18px}.tool{width:34px;height:34px}.readonly-toggle{width:auto}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div class="brand"><b>연필 생각지도</b><small>PENCIL MIND MAP</small></div><button class="tool readonly-toggle" id="readonlyBtn" type="button" aria-pressed="false" title="읽기 전용 모드 전환">readonly</button><button class="tool" id="resetBtn" type="button" aria-label="생각지도 초기화" title="생각지도 초기화"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button><button class="tool" id="centerBtn" aria-label="가운데로 이동" title="가운데로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><circle cx="12" cy="12" r="3"/></svg></button><button class="tool" id="exportBtn" aria-label="JSON 내보내기" title="JSON 내보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button><button class="tool" id="exportHtmlBtn" aria-label="HTML 내보내기" title="HTML 내보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13l-2 2 2 2"/><path d="M14 17l2-2-2-2"/><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></button><label class="fileLabel tool" aria-label="불러오기" title="불러오기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg><input id="importInput" type="file" accept="application/json" hidden></label></header>
 <section class="board" id="board"><div class="world" id="world"><svg class="edges" id="edges"></svg><div id="nodes"></div></div><div class="hint">노드 드래그 · 빈 곳 더블클릭으로 추가 · 캔버스 드래그로 이동</div><button class="fab" id="addBtn" aria-label="노드 추가">＋</button></section>
</main>
<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h2 id="sheetTitle">새 생각 적기</h2><label class="label" for="textInput">내용 · HTML 사용 가능</label><textarea class="node-text" id="textInput" maxlength="2000" placeholder="생각을 자유롭게 적으세요" spellcheck="false"></textarea><label class="label">이모티콘 추가</label><div class="emoji-picker" id="emojiPicker"><button type="button" data-emoji="💡">💡</button><button type="button" data-emoji="✅">✅</button><button type="button" data-emoji="⭐">⭐</button><button type="button" data-emoji="📌">📌</button><button type="button" data-emoji="📚">📚</button><button type="button" data-emoji="📝">📝</button><button type="button" data-emoji="🎯">🎯</button><button type="button" data-emoji="🚀">🚀</button><button type="button" data-emoji="❤️">❤️</button><button type="button" data-emoji="😊">😊</button><button type="button" data-emoji="⚠️">⚠️</button><button type="button" data-emoji="🔗">🔗</button></div><label class="label" for="fontSizeInput">글자 크기</label><div class="font-row"><input id="fontSizeInput" type="range" min="12" max="36" step="1" value="21"><span class="font-value"><output id="fontSizeValue">21</output>px</span></div><div class="row"><div><label class="label" for="parentSelect">연결할 생각</label><select id="parentSelect"></select></div><div><label class="label" for="colorSelect">연필 색</label><select id="colorSelect"><option value="#292923">흑연</option><option value="#9b493c">적갈색</option><option value="#49677a">청회색</option><option value="#65704a">올리브</option></select></div></div><label class="label" for="shapeSelect">노드 모양</label><select id="shapeSelect"><option value="none">테두리 없음</option><option value="oval">둥근 테두리</option><option value="rect">사각 테두리</option></select><div class="node-tools" id="nodeTools"><button type="button" id="addChildBtn">자식 노드 +</button><button type="button" id="copyNodeBtn">복사</button><button type="button" id="pasteNodeBtn">붙여넣기</button></div><div class="actions"><button class="delete" id="deleteBtn">삭제</button><button id="cancelBtn">닫기</button><button class="save" id="saveBtn">적어두기</button></div></section>
<section class="sheet confirm-sheet" id="resetSheet" role="dialog" aria-modal="true" aria-labelledby="resetTitle" aria-hidden="true"><div class="grab"></div><h2 id="resetTitle">생각지도를 초기화할까요?</h2><p>저장된 노드가 지워지고 기본 생각지도로 돌아갑니다. 필요하면 먼저 JSON으로 백업하세요.</p><div class="actions"><button type="button" id="resetCancelBtn">아니요</button><button type="button" class="delete" id="resetConfirmBtn">네, 초기화</button></div></section>
<div class="status" id="status"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), board=$('#board'),world=$('#world'),nodesEl=$('#nodes'),edges=$('#edges'),sheet=$('#sheet'),backdrop=$('#backdrop');
const KEY='pencilMindmap.v1'; let view={x:0,y:0,scale:1}, selected=null, editId=null, gesture=null, nodeClipboard=null, dropTargetId=null, readOnly=false;
const starter=[{id:'root',text:'나의 생각',x:520,y:340,parent:null,color:'#292923'},{id:'a',text:'해야 할 일',x:270,y:190,parent:'root',color:'#9b493c'},{id:'b',text:'배우고 싶은 것',x:775,y:185,parent:'root',color:'#49677a'},{id:'c',text:'기억할 것',x:760,y:485,parent:'root',color:'#65704a'}];
let data=load(); function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:starter}catch{return starter}} function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){nodesEl.innerHTML='';data.forEach((n,i)=>{let el=document.createElement('div'),content=document.createElement('span'),handle=document.createElement('i');el.className=`node shape-${n.shape||'none'} ${n.parent?'':'root'} ${selected===n.id?'selected':''}`;el.dataset.id=n.id;el.style.cssText=`left:${n.x}px;top:${n.y}px;${n.w?`width:${n.w}px;`:''}${n.h?`height:${n.h}px;`:''}font-size:${n.fontSize||(n.parent?21:27)}px;--tone:${n.color};--tilt:${(i%5-2)*.35}deg`;content.className='node-text-content';content.innerHTML=n.text;handle.className='resize-handle';handle.title='크기 조절';el.append(content,handle);nodesEl.appendChild(el)}); drawEdges();}
function nodeRadius(n){let el=nodesEl.querySelector(`[data-id="${n.id}"]`);return {rx:Math.max(45,(el?.offsetWidth||120)/2+5),ry:Math.max(22,(el?.offsetHeight||54)/2+4)}}
function nodeEdge(from,to){let {rx,ry}=nodeRadius(from),dx=to.x-from.x,dy=to.y-from.y;if((from.shape||'none')==='oval'){let d=Math.sqrt((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry))||1;return{x:from.x+dx/d,y:from.y+dy/d}}let t=1/(Math.max(Math.abs(dx)/rx,Math.abs(dy)/ry)||1);return{x:from.x+dx*t,y:from.y+dy*t}}
function edgePath(start,end){let dx=end.x-start.x;if(Math.abs(dx)<1)return `M${start.x},${start.y} L${end.x},${end.y}`;let c=Math.max(32,Math.abs(dx)*.42);return `M${start.x},${start.y} C${start.x+(dx>0?c:-c)},${start.y} ${end.x-(dx>0?c:-c)},${end.y} ${end.x},${end.y}`}
function drawEdges(){edges.innerHTML=data.filter(n=>n.parent).map(n=>{let p=data.find(x=>x.id===n.parent);if(!p)return'';return `<path class="edge" d="${edgePath(nodeEdge(p,n),nodeEdge(n,p))}"/>`}).join('')}
function isDescendant(id,parentId){let n=data.find(x=>x.id===id);while(n?.parent){if(n.parent===parentId)return true;n=data.find(x=>x.id===n.parent)}return false}
function canAttach(nodeId,parentId){return !!parentId&&nodeId!==parentId&&!isDescendant(parentId,nodeId)}
function nodeLabel(n){return esc(n.text.replace(/<[^>]*>/g,'').replace(/\r?\n/g,' ').slice(0,70)||'빈 생각')}
function setDropTarget(id){if(dropTargetId===id)return;dropTargetId=id;nodesEl.querySelectorAll('.node').forEach(x=>x.classList.toggle('drop-target',x.dataset.id===id))}
function hitAttachTarget(x,y,nodeId){let dragged=nodesEl.querySelector(`[data-id="${nodeId}"]`),prev=dragged?.style.pointerEvents;if(dragged)dragged.style.pointerEvents='none';let target=[...document.elementsFromPoint(x,y)].map(el=>el.closest?.('.node')).find(el=>el&&el.dataset.id!==nodeId&&canAttach(nodeId,el.dataset.id))?.dataset.id||null;if(dragged)dragged.style.pointerEvents=prev;return target}
function openNodeLink(e){let a=e.target.closest?.('.node a[href]');if(!a)return false;e.preventDefault();e.stopPropagation();window.open(a.href,'_blank','noopener');return true}
function copyNode(id){if(readOnly)return false;let n=data.find(x=>x.id===id);if(!n)return false;nodeClipboard={sourceId:n.id,text:n.text,color:n.color,shape:n.shape||'none',fontSize:n.fontSize,w:n.w,h:n.h};return true}
